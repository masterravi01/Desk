<div class="d-flex">
  <h5 mat-dialog-title class="h5">Select Bottomnote</h5>
  <button
    class="btn"
    mat-button
    (click)="onCancel()"
    tabindex="-1"
    style="margin-top: 10px; margin-right: 10px"
  >
    ❌
  </button>
</div>

<div class="table-container">
  <table mat-table [dataSource]="BottomNotes" class="mat-elevation-z8 table">
    <ng-container matColumnDef="bottomNoteId">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">
        {{ element.bottomNoteId }}
      </td>
    </ng-container>
    <ng-contaier matColumnDef="bottomNote">
      <th mat-header-cell *matHeaderCellDef>Bottom Note</th>
      <td mat-cell *matCellDef="let element">
        {{ element.bottomNote || "-" }}
      </td>
    </ng-contaier>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      (click)="selectBottomNote(row)"
      mat-row
      *matRowDef="let row; columns: displayedColumns"
    ></tr>
  </table>

  <!-- No data fallback -->
  <div *ngIf="BottomNotes.length === 0" class="no-data">
    No Bottomnotes available.
  </div>
</div>
