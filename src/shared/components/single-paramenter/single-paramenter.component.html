<div class="d-flex">
  <h5 mat-dialog-title class="h5">{{ title }}</h5>
  <button
    class="btn"
    mat-button
    (click)="onCancel()"
    tabindex="-1"
    style="margin-top: 10px; margin-right: 10px"
  >
    ❌
  </button>
</div>
<form [formGroup]="singleForm" class="modal-content">
  <mat-divider></mat-divider>

  <table class="form-table">
    <tbody>
      @if(singleForm.get("id")?.value != '') {
      <tr>
        <td class="label-cell">
          <label>ID:</label>
        </td>
        <td class="input-cell">
          {{ singleForm.get("id")?.value }}
        </td>
      </tr>
      }

      <tr>
        <td class="label-cell">
          <label class="label">{{ parameter }}:</label>
        </td>
        <td class="input-cell">
          <mat-form-field appearance="outline" class="full-width">
            <textarea
              matInput
              rows="3"
              cdkTextareaAutosize
              cdkAutosizeMinRows="2"
              formControlName="value"
            ></textarea>
          </mat-form-field>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="edit-actions">
    <div>
      @if(singleForm.get("id")?.value != '') {
      <button class="btn" mat-raised-button color="warn" (click)="onDelete()">
        Delete
      </button>
      }
    </div>
    <div>
      <button class="btn" mat-raised-button (click)="onCancel()">Cancel</button>
      <button class="btn" mat-raised-button color="primary" (click)="onSave()">
        Save
      </button>
    </div>
  </div>
</form>
