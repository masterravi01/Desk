<div class="d-flex">
  <h5 mat-dialog-title>New Customer</h5>
  <button
    mat-button
    (click)="onCancel()"
    style="margin-top: 10px; margin-right: 10px"
  >
    ❌
  </button>
</div>
<form [formGroup]="customerForm" class="modal-content">
  <mat-divider></mat-divider>

  <!-- Basic Details -->
  <div class="section">
    <h3>Basic Details</h3>
    <div class="grid">
      <div class="form-field">
        <label>Name:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="name" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>Other Phone:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="otherPhone" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>Phone:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="phone" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>URL:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="url" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>Email:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="email" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>Fax:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="fax" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>Contact:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="contact" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>Remark:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="remark" />
        </mat-form-field>
      </div>

      <div class="form-field">
        <label>Designation:</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="designation" />
        </mat-form-field>
      </div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- Customer Address -->
  <div class="section">
    <div class="grid">
      <div>
        <h3>Customer Address</h3>
        <div class="full-width form-field">
          <label>Address:</label>
          <mat-form-field appearance="outline" class="full-width">
            <textarea
              matInput
              rows="2"
              formControlName="customerAddress"
            ></textarea>
          </mat-form-field>
        </div>
        <div class="grid">
          <div class="form-field">
            <label>City:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="customerCity" />
            </mat-form-field>
          </div>

          <div class="form-field">
            <label>State:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="customerState" />
            </mat-form-field>
          </div>

          <div class="form-field">
            <label>Zip:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="customerZip" />
            </mat-form-field>
          </div>

          <div class="form-field">
            <label>Country:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="customerCountry" />
            </mat-form-field>
          </div>
        </div>
      </div>
      <div>
        <h3>Buyer Address</h3>

        <div class="full-width form-field">
          <label>Address:</label>
          <mat-form-field appearance="outline" class="full-width">
            <textarea
              matInput
              rows="2"
              formControlName="buyerAddress"
            ></textarea>
          </mat-form-field>
        </div>
        <div class="grid">
          <div class="form-field">
            <label>City:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="buyerCity" />
            </mat-form-field>
          </div>

          <div class="form-field">
            <label>State:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="buyerState" />
            </mat-form-field>
          </div>

          <div class="form-field">
            <label>Zip:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="buyerZip" />
            </mat-form-field>
          </div>

          <div class="form-field">
            <label>Country:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="buyerCountry" />
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- Bank Address -->
  <div class="section">
    <h3>Bank Address</h3>
    <div class="grid">
      <div>
        <div class="form-field">
          <label>Bank Name:</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="bankName" />
          </mat-form-field>
        </div>
        <div class="form-field">
          <label>Address:</label>
          <mat-form-field appearance="outline" class="full-width">
            <textarea
              matInput
              rows="2"
              formControlName="bankAddress"
            ></textarea>
          </mat-form-field>
        </div>
      </div>

      <div class="grid">
        <div class="form-field">
          <label>Branch:</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="bankBranch" />
          </mat-form-field>
        </div>

        <div class="form-field">
          <label>City:</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="bankCity" />
          </mat-form-field>
        </div>

        <div class="form-field">
          <label>State:</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="bankState" />
          </mat-form-field>
        </div>

        <div class="form-field">
          <label>Zip:</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="bankZip" />
          </mat-form-field>
        </div>

        <div class="form-field">
          <label>Country:</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="bankCountry" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <div class="actions">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save</button>
  </div>
</form>
