<div class="d-flex">
  <h5 mat-dialog-title class="h5">Order Confirmation Report</h5>
  <button
    class="btn"
    mat-button
    (click)="onCancel()"
    tabindex="-1"
    style="margin-top: 14px; margin-right: 0"
  >
    ❌
  </button>
</div>
<mat-divider></mat-divider>

<div class="modal-content">
  <div></div>
  <button
    class="btn"
    mat-raised-button
    style="height: 32px; margin: 20px 0px"
    (click)="openSelectModal()"
  >
    Select Invoice
  </button>
  
  <!-- Company Selection -->
  <div style="margin: 20px 0px">
    <mat-form-field appearance="outline" style="width: 100%;" floatLabel="always">
      <mat-label>Select Company</mat-label>
      <mat-select
        [(ngModel)]="selectedCompanyId"
        [disabled]="orderForm.disabled">
        <mat-option *ngFor="let company of companies" [value]="company.id">
          {{ company.companyName }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  
  <table class="form-table">
    <tbody>
      <tr>
        <td class="label-cell">Customer ID</td>
        <td class="value-cell">{{ orderForm.get("customerId")?.value }}</td>
        <td class="label-cell">Customer Name</td>
        <td class="value-cell">{{ orderForm.get("customerName")?.value }}</td>
      </tr>
      <tr>
        <td class="label-cell">Invoice ID</td>
        <td class="value-cell">{{ orderForm.get("invoiceId")?.value }}</td>
        <td class="label-cell">Invoice No</td>
        <td class="value-cell">{{ orderForm.get("invoicePiNo")?.value }}</td>
      </tr>
    </tbody>
  </table>
  <table class="form-table" style="margin-top: 10px">
    <tbody>
      <tr>
        <td style="padding-right: 20px">
          <select
            style="
              background: #fff;
              height: 30px;
              width: 100%;
              border-radius: 4px;
              margin: 5px 0px;
            "
            [(ngModel)]="reportType"
            [disabled]="orderForm.disabled"
          >
            <option value="ms-word">MS-Word</option>
            <option value="pdf">PDF</option>
          </select>
        </td>
        <td>
          <button
            class="btn table-btn"
            mat-raised-button
            [disabled]="orderForm.disabled"
            (click)="generateDocument('confirmation', '')"
          >
            Order Confirmation
          </button>
        </td>
        <td>
          <button
            class="btn table-btn"
            mat-raised-button
            [disabled]="orderForm.disabled"
            (click)="generateDocument('confirmation', 'uk')"
          >
            Order Confirmation (UK)
          </button>
        </td>
      </tr>
      <tr>
        <td class="label-cell"></td>
        <td>
          <button
            class="btn table-btn"
            mat-raised-button
            [disabled]="orderForm.disabled"
            (click)="generateDocument('confirmation', 'aus')"
          >
            Order Confirmation (Aus)
          </button>
        </td>
        <td>
          <button
            class="btn table-btn"
            mat-raised-button
            [disabled]="orderForm.disabled"
            (click)="generateDocument('opf', '')"
          >
            OPF Report
          </button>
        </td>
      </tr>
      <tr>
        <td class="label-cell"></td>
        <td>
          <button
            class="btn table-btn"
            mat-raised-button
            [disabled]="orderForm.disabled"
            (click)="generateDocument('contract', '')"
          >
            Contract Review
          </button>
        </td>
        <td></td>
      </tr>
    </tbody>
  </table>
</div>
