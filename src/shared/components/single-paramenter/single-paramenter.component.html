<div class="d-flex">
  <h5 mat-dialog-title class="h5">{{ title }}</h5>
  <button
    class="btn"
    mat-button
    (click)="onCancel()"
    tabindex="-1"
    style="margin-top: 10px; margin-right: 10px"
  >
    ❌
  </button>
</div>
<form [formGroup]="singleForm" class="modal-content">
  <mat-divider></mat-divider>

  @if(singleForm.get("id")?.value != '') {
  <div class="full-width form-field">
    <label class="label">ID:</label>
    <h3>{{ singleForm.get("id")?.value }}</h3>
  </div>
  }

  <div class="full-width form-field">
    <label class="label">{{ parameter }}:</label>
    <mat-form-field appearance="outline" class="full-width">
      <textarea matInput rows="2" formControlName="value"></textarea>
    </mat-form-field>
  </div>

  <div class="edit-actions">
    <div>
      @if(singleForm.get("id")?.value != '') {
      <button class="btn" mat-raised-button color="warn" (click)="onDelete()">
        Delete
      </button>
      }
    </div>
    <div>
      <button class="btn" mat-button (click)="onCancel()">Cancel</button>
      <button class="btn" mat-raised-button color="primary" (click)="onSave()">
        Save
      </button>
    </div>
  </div>
</form>
