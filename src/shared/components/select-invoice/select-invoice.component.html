<div class="d-flex">
  <h5 mat-dialog-title class="h5">Select Invoice</h5>
  <button
    class="btn"
    mat-button
    (click)="onCancel()"
    tabindex="-1"
    style="margin-top: 10px; margin-right: 10px"
  >
    ❌
  </button>
</div>
<div style="margin: 0 20px">
  <div class="form-field">
    <mat-form-field appearance="outline">
      <input matInput (keyup)="applyFilter($event)" placeholder="Search Here" />
    </mat-form-field>
  </div>
  <div class="table-container" style="margin: 0; max-height: 500px">
    <table
      mat-table
      [dataSource]="invoices"
      matSort
      class="mat-elevation-z8 table"
    >
      <ng-container
        *ngFor="let column of displayedColumns; let first = first"
        [matColumnDef]="column"
      >
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ column | camelCaseToTitle }}
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element[column] }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        (click)="selectInvoice(row)"
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="clickable-row"
      ></tr>
    </table>
  </div>
</div>
