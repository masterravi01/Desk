<div class="d-flex">
  <h5 mat-dialog-title class="h5">System Parameter</h5>
  <button
    class="btn"
    mat-button
    (click)="onCancel()"
    tabindex="-1"
    style="margin-top: 10px; margin-right: 10px"
  >
    ❌
  </button>
</div>

<mat-tab-group>
  <mat-tab label="Company Information">
    <div class="modal-content">
      <form [formGroup]="companyForm" class="modal-content">
        <!-- Basic Details -->
        <div class="section">
          <h3 class="h3">Company Details</h3>
          <div class="grid">
            <div class="form-field">
              <label class="label">Company Name:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="companyName" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">Short Code:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="companyCode" />
              </mat-form-field>
            </div>

            <div class="full-width form-field">
              <label class="label">Address:</label>
              <mat-form-field appearance="outline" class="full-width">
                <textarea
                  matInput
                  rows="2"
                  formControlName="companyAddressLine1"
                ></textarea>
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">City:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="companyCity" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">State:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="companyState" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">Zip:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="companyPostalCode" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">Country:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="companyCountry" />
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">Currency:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="currencyCode" />
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">Remark:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="remarks" />
              </mat-form-field>
            </div>
          </div>
        </div>

        <mat-divider></mat-divider>

        <!-- Bank Address -->
        <div class="section">
          <h3 class="h3">Bank Address</h3>
          <div class="form-field">
            <label class="label">Bank Name:</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="bankName" />
            </mat-form-field>
          </div>
          <div class="form-field">
            <label class="label">Address:</label>
            <mat-form-field appearance="outline" class="full-width">
              <textarea
                matInput
                rows="2"
                formControlName="bankAddressLine1"
              ></textarea>
            </mat-form-field>
          </div>

          <div class="grid">
            <div class="form-field">
              <label class="label">Branch:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="bankAddressLine2" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">City:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="bankCity" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">State:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="bankState" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">Zip:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="bankPostalCode" />
              </mat-form-field>
            </div>

            <div class="form-field">
              <label class="label">Country:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="bankCountry" />
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">AccountNo:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="accountNumber" />
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">SwiftCode:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="swiftCode" />
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">IEC Code:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="importExportCode" />
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">AD Code:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="additionalNumber" />
              </mat-form-field>
            </div>
            <div class="form-field">
              <label class="label">PanNo:</label>
              <mat-form-field appearance="outline">
                <input matInput formControlName="taxIdentificationNumber" />
              </mat-form-field>
            </div>
          </div>
        </div>

        <mat-divider></mat-divider>

        <div class="actions">
          @if(companyForm.disabled){
          <button
            class="btn"
            mat-raised-button
            color="primary"
            (click)="enableEdit()"
          >
            Edit
          </button>
          }@else {
          <button class="btn" mat-raised-button (click)="onCancel()">
            Cancel
          </button>
          <button
            class="btn"
            mat-raised-button
            color="primary"
            (click)="onSave()"
          >
            Save
          </button>
          }
        </div>
      </form>
    </div>
  </mat-tab>

  <mat-tab label="Currency">
    <div class="modal-content">
      <div class="d-flex" style="margin-top: 10px">
        <h4
          class="primary"
          style="margin-left: 20px; margin-top: 10px; padding: 0"
        >
          Currency
        </h4>
        <button
          class="btn"
          mat-raised-button
          color="primary"
          style="margin-right: 20px"
          (click)="openCurrencyModal()"
        >
          New Currency
        </button>
      </div>

      <div class="table-container">
        <table mat-table [dataSource]="currency" class="mat-elevation-z8 table">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Id</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Currency Name</th>
            <td mat-cell *matCellDef="let element">
              <a mat-button (click)="openCurrencyModal(element)">
                {{ element.currencyName }}</a
              >
            </td>
          </ng-container>
          <ng-container matColumnDef="char">
            <th mat-header-cell *matHeaderCellDef>Currency Char</th>
            <td mat-cell *matCellDef="let element">
              {{ element.currencyChar }}
            </td>
          </ng-container>
          <ng-container matColumnDef="country">
            <th mat-header-cell *matHeaderCellDef>Currency country</th>
            <td mat-cell *matCellDef="let element">
              {{ element.currencyCountry }}
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="['id', 'name', 'char', 'country']"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: ['id', 'name', 'char', 'country']"
          ></tr>
        </table>
      </div>
    </div>
  </mat-tab>
</mat-tab-group>
