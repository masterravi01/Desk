<h5 mat-dialog-title>Business Master</h5>

<mat-tab-group>
  <mat-tab label="Customer"></mat-tab>
  <mat-tab label="Instruction"></mat-tab>
  <mat-tab label="Containers"></mat-tab>
  <mat-tab label="Currency"></mat-tab>
  <mat-tab label="Bottom Note"></mat-tab>
</mat-tab-group>

<div class="modal-content">
  <div class="d-flex">
    <h4 class="primary" style="margin-left: 20px; margin-top: 10px; padding: 0">
      Customers
    </h4>
    <button
      mat-raised-button
      color="primary"
      style="margin-right: 20px"
      (click)="openCustomerModal()"
    >
      New Customer
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="customers" class="mat-elevation-z8">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
