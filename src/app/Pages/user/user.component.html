<h2>User List</h2>
@for (user of users; track $index) {
<mat-card>
    <mat-card-title>{{ user.name }}</mat-card-title>
    <mat-card-content>{{ user.email }}</mat-card-content>
    <mat-card-actions>
        <a mat-button color="primary" [routerLink]="['/edit', user.id]">Edit</a>
        <button mat-button color="warn" (click)="confirmDelete(user.id)">Delete</button>
    </mat-card-actions>
</mat-card>
}


<a mat-raised-button color="primary" routerLink="/products">Create User</a>
<button mat-raised-button color="primary" (click)="downloadWord()">Download Word</button>
<button mat-raised-button color="primary" (click)="downloadExcel()">download Excel</button>
