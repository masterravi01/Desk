<div class="d-flex">
  <h5 mat-dialog-title class="h5">Select Customer</h5>
  <button
    class="btn"
    mat-button
    (click)="onCancel()"
    tabindex="-1"
    style="margin-top: 10px; margin-right: 10px"
  >
    ❌
  </button>
</div>

<app-table
  [dataSource]="customers"
  [displayedColumns]="displayedColumns"
  (rowClick)="selectCustomer($event)"
>
</app-table>
