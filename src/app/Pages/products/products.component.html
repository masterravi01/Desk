<h2>Create User</h2>
<mat-form-field appearance="outline">
  <mat-label>Name</mat-label>
  <input matInput [(ngModel)]="user.name" />
</mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Email</mat-label>
  <input matInput [(ngModel)]="user.email" />
</mat-form-field>

<button class="btn" mat-raised-button color="primary" (click)="createUser()">
  Submit
</button>
<a mat-raised-button color="warn" routerLink="/">Cancel</a>
